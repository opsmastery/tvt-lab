auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Spike 2: at info level Loki logs a "query stats" line per query
  # (metrics.go), which is the LogQL usage evidence.
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 45d
  allow_structured_metadata: true
  # Enables /loki/api/v1/index/volume: bytes per stream, for the cost model.
  volume_enabled: true
  # The shop pushes bursts of debug logs; leave headroom.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

# Pattern ingester: powers /loki/api/v1/patterns, which tvt uses to find
# high-volume line patterns inside a stream (the /healthz scenario).
pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
