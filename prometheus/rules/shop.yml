groups:
  - name: shop-recording
    rules:
      # Feeds ShopHighLatency below, so the histogram buckets are a transitive hard keep.
      - record: route:shop_http_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (le, route) (rate(shop_http_request_duration_seconds_bucket[5m])))

      # Feeds nothing: no alert, no dashboard. The rule and its inputs are waste.
      - record: job:shop_cache_hit_ratio:5m
        expr: sum by (job) (rate(shop_cache_hits_total[5m])) / sum by (job) (rate(shop_cache_requests_total[5m]))

  - name: shop-alerts
    rules:
      - alert: ShopHighLatency
        expr: route:shop_http_request_duration_seconds:p99_5m > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency on {{ $labels.route }} above 500ms"

      - alert: ShopHighErrorRate
        expr: |
          sum(rate(shop_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(shop_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Shop 5xx ratio above 5%"

      # Staleness plus absence alert: returns nothing while the sync runs, so its
      # metric looks unread to every query log. It is a hard keep, and it is not
      # a broken rule. The staleness branch catches a sync that stopped advancing
      # (the series stays exported); absent() catches the series disappearing.
      # INVENTORY_SYNC=stale or missing on the shop makes each branch fire.
      - alert: ShopInventorySyncMissing
        expr: |
          time() - shop_inventory_sync_last_success_timestamp_seconds{job="shop"} > 600
          or absent(shop_inventory_sync_last_success_timestamp_seconds{job="shop"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The inventory sync has not succeeded for 10 minutes, or stopped reporting"

      # Alert-only metric: on no dashboard and never queried, but must never be dropped.
      - alert: ShopPaymentQueueBacklog
        expr: shop_payment_queue_depth > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Payment queue backlog"
          # Its query step is the only reader of shop_payment_gateway_retries_total
          # (Sprint 2 item 7). tvt reads it through a tvt.yaml runbooks mirror.
          runbook_url: https://github.com/Opsmastery-Summit/tvt-lab/blob/main/runbooks/payment-queue-backlog.md

      # Reads a metric the Collector's count connector makes from the shop's
      # error log lines (otelcol/config.yaml count/shop_errors, tvt S8 item
      # 10): dropping or emptying {app="shop", level="error"} silences it.
      - alert: ShopErrorLogBurst
        expr: sum(rate(shop_error_log_lines_total[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The shop is logging more than 2 error lines a second"
