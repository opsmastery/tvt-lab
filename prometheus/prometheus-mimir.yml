# Used by `make up-mimir`: same as prometheus.yml plus remote_write to Mimir.
global:
  scrape_interval: 10s
  evaluation_interval: 30s
  query_log_file: /var/log/prometheus/query.log  # ./lab-logs/prometheus on the host, read live by tvt

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_config_files:
  - /etc/prometheus/scrape/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

remote_write:
  - url: http://mimir:9009/api/v1/push
