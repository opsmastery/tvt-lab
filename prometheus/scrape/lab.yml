scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: shop
    static_configs:
      - targets: ["shop:8080"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
  # 15s, while its only reader (the Alertmanager Health dashboard) uses a 1m
  # step: tvt S3's lower-resolution seed.
  - job_name: alertmanager
    scrape_interval: 15s
    static_configs:
      - targets: ["alertmanager:9093"]
