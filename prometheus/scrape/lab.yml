scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # shop and node are scraped by Alloy (alloy/config.alloy) since Nov 15,
  # with the same job and instance labels, and remote-written here.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    # tvt:begin prometheus-scrape/grafana scan=1 evidence=99b3011ea94f
    # 1 unread metric, see tvt why; saves 1.47 USD/month
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "grafana_feature_toggles_info"
        action: drop
    # tvt:end
  # 15s, while its only reader (the Alertmanager Health dashboard) uses a 1m
  # step: tvt S3's lower-resolution seed.
  - job_name: alertmanager
    scrape_interval: 15s
    static_configs:
      - targets: ["alertmanager:9093"]
