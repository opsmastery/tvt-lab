# tvt-lab: a Grafana stack seeded with known telemetry waste and known
# dependencies, used as ground truth for Telemetry Value Tracker.
#
#   make up          # default stack
#   make up-mimir    # also run Mimir and remote-write to it
#
# Image names are fully qualified so Podman never prompts for short-name resolution.

# Ports are published on 127.0.0.1 only: Grafana runs with admin/admin. To reach
# the lab from another machine, change the bindings deliberately.

name: tvt-lab

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/${PROM_CONFIG:-prometheus.yml}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d   # tvt needs >= 30 days of history
      # A size cap as well (tvt S3 self-hosted price card): whichever limit is
      # hit first wins. Kept well above the lab's ~2 GB so time still governs.
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
      # The Loki ruler writes its recording rules here (tvt Sprint 2 item 12).
      - --web.enable-remote-write-receiver
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      # The query log on the host, so tvt scan reads the live file and finds
      # its probe query (tvt Sprint 2 item 4). Created world-writable by make
      # (Prometheus runs as nobody).
      - ./lab-logs/prometheus:/var/log/prometheus
    depends_on: [alertmanager]
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    depends_on: [alertmanager]
    restart: unless-stopped
    # Loki's own log (its query log: metrics.go lines) as a file on the host
    # in the CRI format, for tvt scan --loki-query-log. LAB_LOGS is set by make.
    logging:
      driver: k8s-file
      options:
        path: ${LAB_LOGS:?run through make, or set LAB_LOGS to the absolute path of ./lab-logs}/loki.log
        max-size: 1gb  # Podman ignores max_size; it truncates the file at this size

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Spike 1: can dashboard/panel usage be seen in OSS logs?
      GF_SERVER_ROUTER_LOGGING: "true"
      GF_DATAPROXY_LOGGING: "true"
      # Forward X-Grafana-User to datasources, so query logs that record
      # headers (Mimir) can attribute a query to a person.
      GF_DATAPROXY_SEND_USER_HEADER: "true"
      # Keep the router log (dashboard-view evidence) on the data volume, so
      # it survives container recreation. tvt reads
      # /var/lib/grafana/logs/grafana.log*. Retention matches Prometheus.
      GF_LOG_MODE: "console file"
      GF_PATHS_LOGS: /var/lib/grafana/logs
      GF_LOG_FILE_MAX_DAYS: "45"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped

  node-exporter:
    # Realistic "exporter emits hundreds of metrics, a handful are used".
    # Inside a Podman machine this reports the VM, which is fine for the lab.
    image: docker.io/prom/node-exporter:v1.9.1
    ports: ["127.0.0.1:9100:9100"]
    restart: unless-stopped

  shop:
    # Seeded app: emits used metrics, unused metrics, a high-cardinality label,
    # and info/debug/audit log streams. See ground-truth.yaml.
    build:
      context: ./shop
      dockerfile: Containerfile
    image: localhost/tvt-lab-shop:latest
    ports: ["127.0.0.1:8080:8080"]
    environment:
      # Logs go through Alloy (alloy/config.alloy); the reconciler's skip it.
      LOKI_URL: http://alloy:3500
      RECONCILER_LOKI_URL: http://loki:3100
      OTLP_TRACES_URL: http://alloy:4318/v1/traces   # span metrics that overflow (alloy/config.alloy)
      REQUESTS_PER_SECOND: "20"
      HEALTHCHECKS_PER_SECOND: "30"   # /healthz scenario: probers x replicas
      INVENTORY_SYNC: ${INVENTORY_SYNC:-ok}   # ok | stale | missing: fires ShopInventorySyncMissing
      DEBUG_LOG_FILE: /var/log/shop/debug.log   # debug api lines: tailed by fluent-bit (tvt S7)
    volumes:
      - shop-logs:/var/log/shop
    depends_on:
      alloy:
        condition: service_started
      shop-logs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  shop-logs-init:
    # The shop runs as nobody and rotates its debug log by renaming it, so
    # the shared volume's root must be nobody's. A volume created before
    # the image's /var/log/shop (or by scripts/import-volumes.sh) is root's,
    # and then rotation fails and the debug stream stops at 50 MB (seen on
    # the Mac mini, Nov 17). This one-shot fixes the owner on every up.
    image: docker.io/library/busybox:1.37.0
    command: ["chown", "65534:65534", "/var/log/shop"]
    volumes:
      - shop-logs:/var/log/shop
    restart: "no"

  alloy:
    # The lab's pipeline (tvt Sprint 2 item 14, ADR 0007): scrapes the shop and
    # node-exporter and remote-writes to Prometheus, and ships the shop's logs
    # to Loki. Its config directory stands in for a pipeline repo.
    image: docker.io/grafana/alloy:v1.10.0
    # ALLOY_OUTPUT=cloud also forwards a free-tier subset to the Grafana
    # Cloud test stack (alloy/outputs/cloud.alloy; GCLOUD_* from your shell,
    # never this repo). Default local: nothing leaves the lab.
    command:
      - run
      - /etc/alloy/run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports: ["127.0.0.1:12345:12345"]
    environment:
      GCLOUD_HOSTED_METRICS_URL: ${GCLOUD_HOSTED_METRICS_URL:-}
      GCLOUD_HOSTED_METRICS_ID: ${GCLOUD_HOSTED_METRICS_ID:-}
      GCLOUD_HOSTED_LOGS_URL: ${GCLOUD_HOSTED_LOGS_URL:-}
      GCLOUD_HOSTED_LOGS_ID: ${GCLOUD_HOSTED_LOGS_ID:-}
      GCLOUD_RW_API_KEY: ${GCLOUD_RW_API_KEY:-}
      TVT_LAB_SPANS_DROP_REGEX: tvt_lab_env_no_such_metric   # alloy/config.alloy prometheus.relabel "spans": tvt can't see this value
    volumes:
      - ./alloy/config.alloy:/etc/alloy/run/config.alloy:ro
      - ./alloy/outputs/${ALLOY_OUTPUT:-local}.alloy:/etc/alloy/run/output.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [prometheus, loki]
    restart: unless-stopped

  fluent-bit:
    # The lab's second log pipeline (tvt S7, ADR 0009): tails the shop's debug
    # api log and ships it to Loki as {app="shop", component="api",
    # level="debug"}. Its config directory stands in for a pipeline repo.
    image: docker.io/fluent/fluent-bit:5.2.0
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - shop-logs:/var/log/shop:ro
      - fluent-bit-data:/var/lib/fluent-bit
    depends_on: [loki, shop]
    restart: unless-stopped

  otelcol:
    # The lab's OTel Collector pipeline (tvt S7): receives the synthetic coding
    # agent's traces, logs and delta counters. Metrics are remote-written to
    # Prometheus, logs go to Loki's OTLP endpoint, traces to the nop exporter.
    # Its config directory stands in for a pipeline repo.
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0
    # The feature gate turns on OTTL's experimental functions, which
    # transform/lint's ToValidUTF8 seed needs (tvt S8).
    command: ["--config=/etc/otelcol/config.yaml", "--feature-gates=pkg.ottl.functions.enableExperimental"]
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [prometheus, loki]
    restart: unless-stopped

  genai-agent:
    # Synthetic coding-agent telemetry on the GenAI conventions (tvt S7):
    # made-up sessions, prompts and tool calls, every content flag on.
    build:
      context: ./genai-agent
      dockerfile: Containerfile
    image: localhost/tvt-lab-genai-agent:latest
    environment:
      OTLP_ENDPOINT: http://otelcol:4318
      INTERACTION_SECONDS: "30"
    depends_on: [otelcol]
    restart: unless-stopped

  viewer:
    # Simulates people using the "Shop Overview" dashboard (queries sent
    # through Grafana with dashboard/panel attribution headers) plus occasional
    # ad hoc Explore queries. "Legacy Queue" is deliberately never viewed.
    image: docker.io/curlimages/curl:8.15.0
    entrypoint: ["/bin/sh", "/viewer/view.sh"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_AUTH: admin:admin
      PROM_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      INTERVAL_SECONDS: "300"
    volumes:
      - ./viewer:/viewer:ro
    depends_on: [grafana]
    restart: unless-stopped

  agent:
    # Simulated AI agent clients (agent/agent.sh): one sweeps every metric
    # name, one asks for a single metric over 90 days. tvt S3 items 5-6.
    image: docker.io/curlimages/curl:8.15.0
    entrypoint: ["/bin/sh", "/agent/agent.sh"]
    environment:
      PROM_URL: http://prometheus:9090
      MIMIR_URL: http://mimir:9009/prometheus
      INTERVAL_SECONDS: "900"
    volumes:
      - ./agent:/agent:ro
    depends_on: [prometheus]
    restart: unless-stopped

  mimir:
    image: docker.io/grafana/mimir:2.16.0
    profiles: [mimir]
    command: ["-config.file=/etc/mimir/mimir.yml"]
    ports: ["127.0.0.1:9009:9009"]
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    restart: unless-stopped
    # Mimir's own log (query-frontend query stats lines), for tvt scan
    # --mimir-query-log.
    logging:
      driver: k8s-file
      options:
        path: ${LAB_LOGS:?run through make, or set LAB_LOGS to the absolute path of ./lab-logs}/mimir.log
        max-size: 1gb  # Podman ignores max_size; it truncates the file at this size

  # One-shot: loads mimir/rules/*.yml into Mimir's ruler (namespace tvt-lab),
  # since the lab's Mimir has no rules of its own otherwise.
  mimir-rules:
    image: docker.io/curlimages/curl:8.11.1
    profiles: [mimir]
    depends_on: [mimir]
    entrypoint: ["/bin/sh", "/load-rules.sh"]
    volumes:
      - ./mimir/load-rules.sh:/load-rules.sh:ro
      - ./mimir/rules:/rules:ro
    restart: "no"

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  mimir-data:
  alloy-data:
  shop-logs:
  fluent-bit-data:
