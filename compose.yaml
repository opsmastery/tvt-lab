# tvt-lab: a Grafana stack seeded with known telemetry waste and known
# dependencies, used as ground truth for Telemetry Value Tracker.
#
#   make up          # default stack
#   make up-mimir    # also run Mimir and remote-write to it
#
# Image names are fully qualified so Podman never prompts for short-name resolution.

name: tvt-lab

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/${PROM_CONFIG:-prometheus.yml}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=45d   # tvt needs >= 30 days of history
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on: [alertmanager]
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    depends_on: [alertmanager]
    restart: unless-stopped

  alertmanager:
    image: docker.io/prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Spike 1: can dashboard/panel usage be seen in OSS logs?
      GF_SERVER_ROUTER_LOGGING: "true"
      GF_DATAPROXY_LOGGING: "true"
      # Forward X-Grafana-User to datasources, so query logs that record
      # headers (Mimir) can attribute a query to a person.
      GF_DATAPROXY_SEND_USER_HEADER: "true"
      # Keep the router log (dashboard-view evidence) on the data volume, so
      # it survives container recreation. tvt reads
      # /var/lib/grafana/logs/grafana.log*. Retention matches Prometheus.
      GF_LOG_MODE: "console file"
      GF_PATHS_LOGS: /var/lib/grafana/logs
      GF_LOG_FILE_MAX_DAYS: "45"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped

  node-exporter:
    # Realistic "exporter emits hundreds of metrics, a handful are used".
    # Inside a Podman machine this reports the VM, which is fine for the lab.
    image: docker.io/prom/node-exporter:v1.9.1
    ports: ["9100:9100"]
    restart: unless-stopped

  shop:
    # Seeded app: emits used metrics, unused metrics, a high-cardinality label,
    # and info/debug/audit log streams. See ground-truth.yaml.
    build:
      context: ./shop
      dockerfile: Containerfile
    image: localhost/tvt-lab-shop:latest
    ports: ["8080:8080"]
    environment:
      LOKI_URL: http://loki:3100
      REQUESTS_PER_SECOND: "20"
      HEALTHCHECKS_PER_SECOND: "30"   # /healthz scenario: probers x replicas
    depends_on: [loki]
    restart: unless-stopped

  viewer:
    # Simulates people using the "Shop Overview" dashboard (queries sent
    # through Grafana with dashboard/panel attribution headers) plus occasional
    # ad hoc Explore queries. "Legacy Queue" is deliberately never viewed.
    image: docker.io/curlimages/curl:8.15.0
    entrypoint: ["/bin/sh", "/viewer/view.sh"]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_AUTH: admin:admin
      PROM_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      INTERVAL_SECONDS: "300"
    volumes:
      - ./viewer:/viewer:ro
    depends_on: [grafana]
    restart: unless-stopped

  mimir:
    image: docker.io/grafana/mimir:2.16.0
    profiles: [mimir]
    command: ["-config.file=/etc/mimir/mimir.yml"]
    ports: ["9009:9009"]
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    restart: unless-stopped

  # One-shot: loads mimir/rules/*.yml into Mimir's ruler (namespace tvt-lab),
  # since the lab's Mimir has no rules of its own otherwise.
  mimir-rules:
    image: docker.io/curlimages/curl:8.11.1
    profiles: [mimir]
    depends_on: [mimir]
    entrypoint: ["/bin/sh", "/load-rules.sh"]
    volumes:
      - ./mimir/load-rules.sh:/load-rules.sh:ro
      - ./mimir/rules:/rules:ro
    restart: "no"

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  mimir-data:
