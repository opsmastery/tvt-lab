# The lab's Fluent Bit pipeline (tvt S7, ADR 0009): the shop's debug api log.
# tvt proposes changes here for {app="shop", component="api", level="debug"}:
# a grep Exclude, or rewrite_tag with a second output for cold storage.
service:
  flush: 1
  log_level: info

pipeline:
  inputs:
    - name: tail
      tag: shop.debug
      path: /var/log/shop/debug.log
      db: /var/lib/fluent-bit/tail.db
      refresh_interval: 5
      rotate_wait: 10
      read_from_head: false
      mem_buf_limit: 20MB
    # tvt:begin reroute:loki:stream:{app="shop", component="api", level="debug", service_name="shop"} scan=1 evidence=de5102191462
  filters:
    # 1 unread stream, see tvt why; saves 9.43 USD/month
    - name: rewrite_tag
      match: shop.debug
      rule: $log ^.*$ tvt.cold.shop.debug false
      emitter_name: tvt_cold_shop_debug
    # tvt:end

  outputs:
    - name: loki
      match: shop.debug
      host: loki
      port: 3100
      labels: app=shop, component=api, level=debug
      drop_single_key: raw

    # The cold tier (tvt S7, pipelines[].cold): a stand-in for an archive.
    # tvt's rewrite_tag retags the debug stream to tvt.cold.shop.debug, which
    # only this output takes.
    - name: file
      alias: cold
      match: tvt.cold.*
      path: /tmp/cold
      mkdir: true   # the directory doesn't exist in the image; without this every write fails
