# The lab's OpenTelemetry Collector pipeline (tvt S7, ADR 0007). This
# directory stands in for a pipeline repo (ground truth pipelines:
# otelcol-agent). It receives the synthetic coding agent's telemetry
# (genai-agent/) and is where tvt's otelcol filter/transform proposals land.
#
# Seeds:
# - a batch processor in every pipeline: tvt never writes one (ADR 0013, S7
#   item 6), and S16's config check flags it (removed in v0.177.0);
# - delta counters with session.id and user.email: delta_to_cumulative turns
#   them into the cumulative series Prometheus needs, one per session;
# - traces go to the nop exporter: the lab has no trace backend, so tool
#   spans exist only in this pipeline (records: tvt must never filter them).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Sets a metric label (tvt S7 item 9, label rules): deployment_environment
  # is held on the agent's metrics, never proposed.
  attributes/env:
    actions:
      - key: deployment.environment
        action: upsert
        value: lab
  batch: {}
  delta_to_cumulative: {}
  # tvt:begin otelcol-agent scan=1 evidence=2f40fe19548a
  # 2 unread metrics, see tvt why; saves 0.62 USD/month
  filter/tvt:
    error_mode: ignore
    metrics:
      metric:
        - 'metric.name == "coding_agent_cost_usage_USD_total"'
        - 'metric.is_monotonic == true and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+cost[^A-Za-z0-9:]+usage[^A-Za-z0-9:]+USD(?:[^A-Za-z0-9:]+total)?$") and (metric.unit == "" or IsMatch(metric.unit, "^[{].*[}]$") or metric.unit == "1")'
        - 'metric.is_monotonic == false and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+cost[^A-Za-z0-9:]+usage[^A-Za-z0-9:]+USD[^A-Za-z0-9:]+total$") and (metric.unit == "" or IsMatch(metric.unit, "^[{].*[}]$"))'
        - 'metric.is_monotonic == true and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+cost[^A-Za-z0-9:]+usage(?:[^A-Za-z0-9:]+total)?$") and metric.unit == "USD"'
        - 'metric.name == "coding_agent_token_usage_total"'
        - 'metric.is_monotonic == true and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+token[^A-Za-z0-9:]+usage(?:[^A-Za-z0-9:]+total)?$") and (metric.unit == "" or IsMatch(metric.unit, "^[{].*[}]$") or metric.unit == "1")'
        - 'metric.is_monotonic == false and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+token[^A-Za-z0-9:]+usage[^A-Za-z0-9:]+total$") and (metric.unit == "" or IsMatch(metric.unit, "^[{].*[}]$"))'
        - 'metric.is_monotonic == true and IsMatch(metric.name, "^coding[^A-Za-z0-9:]+agent[^A-Za-z0-9:]+token(?:[^A-Za-z0-9:]+total)?$") and metric.unit == "usage"'
  # tvt:end

exporters:
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  nop: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [nop]
    metrics:
      receivers: [otlp]
      processors: [filter/tvt, attributes/env, delta_to_cumulative, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
