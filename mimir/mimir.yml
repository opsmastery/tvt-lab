# Single-process Mimir for the lab (profile: mimir). Not for production.
multitenancy_enabled: false
target: all

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/storage

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb

ruler_storage:
  storage_prefix: ruler

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

limits:
  # Enables the cardinality analysis API (label names/values per metric).
  cardinality_analysis_enabled: true

frontend:
  # Spike 2: a negative value logs every query, not just slow ones.
  log_queries_longer_than: -1s
  query_stats_enabled: true
